<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>The Fifth Wall &mdash; Studio Content Manager</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="cms-config-url" type="text/yaml" href="config.yml">
  
  <style>
    /* Elegant Studio loading placeholder */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1f1f1f;
      color: #f4f3f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .token-bar {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 99999;
      background: rgba(26, 26, 26, 0.95);
      border: 1px solid #8C6A3B;
      padding: 10px 18px;
      border-radius: 6px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .token-bar button {
      background: #8C6A3B;
      color: #FAFAF8;
      border: none;
      padding: 6px 14px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      border-radius: 3px;
      font-weight: 500;
    }
    .token-bar button:hover {
      background: #a37c45;
    }
  </style>

  <script>
    (function() {
      // 1. Completely neutralize Netlify Identity
      delete window.netlifyIdentity;
      try {
        Object.defineProperty(window, 'netlifyIdentity', {
          get: function() { return undefined; },
          set: function() {},
          configurable: false
        });
      } catch (e) {}

      // 2. Strictly hardcoded URLs for GitHub PKCE flow
      const SITE_URL = 'https://www.thefifthwallarchitecture.com';
      const CALLBACK_URL = 'https://www.thefifthwallarchitecture.com/admin/';
      const GITHUB_CLIENT_ID = 'Ov23liAe14yMQXRZJ3nk';

      // 3. Canonical domain enforcement for live site
      if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        const currentClean = window.location.origin + window.location.pathname;
        if (currentClean !== CALLBACK_URL) {
          window.location.replace(CALLBACK_URL + window.location.search + window.location.hash);
          return;
        }
      }

      // 4. Handle incoming GitHub OAuth redirect callback (?code=...)
      const urlParams = new URLSearchParams(window.location.search);
      const authCode = urlParams.get('code');
      if (authCode) {
        // Exchange code for token via Vercel serverless PKCE endpoint
        fetch('/api/pkce-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: authCode,
            client_id: GITHUB_CLIENT_ID,
            redirect_uri: CALLBACK_URL
          })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.access_token) {
            localStorage.setItem('decap-cms-user', JSON.stringify({ token: data.access_token }));
            window.location.replace(CALLBACK_URL);
          } else {
            const errMsg = (data && (data.error_description || data.error)) || 'Failed to authenticate';
            alert('GitHub Authentication: ' + errMsg);
            window.location.replace(CALLBACK_URL);
          }
        })
        .catch(function(err) {
          alert('Authentication error: ' + err.message);
          window.location.replace(CALLBACK_URL);
        });
        return;
      }

      // 5. Intercept Decap CMS internal authorization requests
      const _origOpen = window.open;
      window.open = function(url, title, features) {
        if (typeof url === 'string') {
          // Catch Netlify popups OR GitHub OAuth requests
          if (url.indexOf('api.netlify.com') !== -1 || title === 'Netlify Authorization' || url.indexOf('github.com/login/oauth') !== -1) {
            const state = Math.random().toString(36).substring(2);
            sessionStorage.setItem('oauth_state', state);

            let targetUrl;
            try {
              targetUrl = new URL(url.indexOf('github.com') !== -1 ? url : 'https://github.com/login/oauth/authorize');
            } catch (e) {
              targetUrl = new URL('https://github.com/login/oauth/authorize');
            }

            // Strictly enforce client_id, callback, and scopes
            if (!targetUrl.searchParams.get('client_id')) {
              targetUrl.searchParams.set('client_id', GITHUB_CLIENT_ID);
            }
            if (!targetUrl.searchParams.get('redirect_uri')) {
              targetUrl.searchParams.set('redirect_uri', CALLBACK_URL);
            }
            if (!targetUrl.searchParams.get('scope')) {
              targetUrl.searchParams.set('scope', 'repo');
            }
            if (!targetUrl.searchParams.get('state')) {
              targetUrl.searchParams.set('state', state);
            }

            window.location.href = targetUrl.toString();
            return null;
          }
        }
        return _origOpen.apply(this, arguments);
      };

      // 6. Guarantee redirect_uri across any URLSearchParams usage
      const OrigURLSearchParams = window.URLSearchParams;
      window.URLSearchParams = class extends OrigURLSearchParams {
        constructor(init) {
          if (init && typeof init === 'object' && !(init instanceof OrigURLSearchParams) && !Array.isArray(init)) {
            if ('redirect_uri' in init) {
              init = Object.assign({}, init, { redirect_uri: CALLBACK_URL });
            }
          } else if (Array.isArray(init)) {
            init = init.map(function(pair) {
              return pair[0] === 'redirect_uri' ? [pair[0], CALLBACK_URL] : pair;
            });
          }
          super(init);
        }
        set(name, value) {
          if (name === 'redirect_uri') {
            return super.set(name, CALLBACK_URL);
          }
          return super.set(name, value);
        }
        append(name, value) {
          if (name === 'redirect_uri') {
            return super.append(name, CALLBACK_URL);
          }
          return super.append(name, value);
        }
      };

      // 7. Intercept fetch requests to guarantee token exchange uses hardcoded callback
      const origFetch = window.fetch;
      window.fetch = function(resource, init) {
        if (init && init.body && typeof init.body === 'string' && init.body.indexOf('redirect_uri=') !== -1) {
          init.body = init.body.replace(/redirect_uri=[^&]+/g, 'redirect_uri=' + encodeURIComponent(CALLBACK_URL));
        }
        return origFetch.apply(this, arguments);
      };
    })();
  </script>
</head>
<body>
  <!-- Fallback Token Bar (Shown only if not logged in) -->
  <div class="token-bar" id="tokenBar" style="display: none;">
    <span style="color:#b5b4af;">Quick Login:</span>
    <button onclick="promptToken()">Enter GitHub Token</button>
  </div>

  <script>
    function promptToken() {
      const token = prompt('Enter your GitHub Personal Access Token (classic token with "repo" scope):');
      if (token && token.trim()) {
        localStorage.setItem('decap-cms-user', JSON.stringify({ token: token.trim() }));
        window.location.reload();
      }
    }

    // Show token bar only if user is not already logged in
    window.addEventListener('load', function() {
      setTimeout(function() {
        const user = localStorage.getItem('decap-cms-user');
        if (!user) {
          const bar = document.getElementById('tokenBar');
          if (bar) bar.style.display = 'flex';
        }
      }, 500);
    });
  </script>

  <!-- Decap CMS Core Script (Pure GitHub Backend) -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
