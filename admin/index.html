<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>The Fifth Wall &mdash; Studio Content Manager</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="cms-config-url" type="text/yaml" href="config.yml">
  
  <!-- Netlify Identity Widget (supports Netlify Git Gateway authentication) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <style>
    /* Elegant Studio loading placeholder */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1f1f1f;
      color: #f4f3f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Decap CMS Core Script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <!-- Netlify Identity automatic redirection listener -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function(user) {
        if (!user) {
          window.netlifyIdentity.on("login", function() {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
